<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Crazy Click</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #ffffff;
        touch-action: none;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }

      .screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      .screen.active {
        opacity: 1;
        pointer-events: all;
      }

      /* Idle Screen */
      .idle-screen {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
        gap: 24px;
      }

      .idle-title {
        font-size: 48px;
        font-weight: 900;
        letter-spacing: -1px;
        text-align: center;
        background: linear-gradient(90deg, #00f5ff, #7b2fff, #ff006e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-shadow: none;
        animation: titlePulse 3s ease-in-out infinite;
      }

      @keyframes titlePulse {
        0%, 100% { filter: brightness(1); }
        50% { filter: brightness(1.3); }
      }

      .idle-subtitle {
        font-size: 18px;
        color: #888;
        text-align: center;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .idle-stats {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 20px 40px;
        background: rgba(255,255,255,0.05);
        border-radius: 16px;
        border: 1px solid rgba(0,245,255,0.1);
        min-width: 240px;
      }

      .idle-stats .stat-row {
        display: flex;
        justify-content: space-between;
        width: 100%;
        gap: 16px;
      }

      .idle-stats .stat-label {
        color: #666;
        font-size: 14px;
      }

      .idle-stats .stat-value {
        color: #00f5ff;
        font-size: 14px;
        font-weight: 700;
      }

      .play-btn {
        width: 160px;
        height: 160px;
        border-radius: 50%;
        border: none;
        background: linear-gradient(135deg, #00f5ff, #7b2fff);
        color: white;
        font-size: 28px;
        font-weight: 900;
        cursor: pointer;
        letter-spacing: 1px;
        box-shadow: 0 0 40px rgba(0,245,255,0.4), 0 0 80px rgba(123,47,255,0.2);
        transition: transform 0.1s ease, box-shadow 0.1s ease;
        position: relative;
        overflow: hidden;
      }

      .play-btn:active {
        transform: scale(0.95);
        box-shadow: 0 0 20px rgba(0,245,255,0.3);
      }

      .play-btn::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: rgba(255,255,255,0.1);
        border-radius: 50%;
        animation: btnGlow 2s ease-in-out infinite;
      }

      @keyframes btnGlow {
        0%, 100% { transform: scale(0.8); opacity: 0; }
        50% { transform: scale(1.1); opacity: 1; }
      }

      .leaderboard-btn {
        background: transparent;
        border: 1px solid rgba(0,245,255,0.3);
        color: #00f5ff;
        padding: 12px 32px;
        border-radius: 24px;
        font-size: 14px;
        cursor: pointer;
        letter-spacing: 1px;
        transition: all 0.2s ease;
      }

      .leaderboard-btn:active {
        background: rgba(0,245,255,0.1);
      }

      /* Countdown Screen */
      .countdown-screen {
        background: #0a0a0a;
      }

      .countdown-number {
        font-size: 160px;
        font-weight: 900;
        color: #00f5ff;
        text-shadow: 0 0 40px rgba(0,245,255,0.8), 0 0 80px rgba(0,245,255,0.4);
        animation: countdownPop 0.8s ease-out forwards;
        line-height: 1;
      }

      .countdown-go {
        font-size: 100px;
        font-weight: 900;
        background: linear-gradient(90deg, #00f5ff, #ff006e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        animation: countdownPop 0.8s ease-out forwards;
      }

      @keyframes countdownPop {
        0% { transform: scale(2); opacity: 0; }
        40% { transform: scale(0.9); opacity: 1; }
        70% { transform: scale(1.05); }
        100% { transform: scale(1); opacity: 1; }
      }

      @keyframes countdownFadeOut {
        0% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.5); opacity: 0; }
      }

      /* Play Screen */
      .play-screen {
        background: #0a0a0a;
        flex-direction: column;
        justify-content: flex-start;
        padding: 0;
        cursor: pointer;
      }

      .play-header {
        width: 100%;
        padding: 16px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(0,0,0,0.5);
        backdrop-filter: blur(10px);
        z-index: 10;
        flex-shrink: 0;
      }

      .score-counter {
        font-size: 56px;
        font-weight: 900;
        color: #00f5ff;
        text-shadow: 0 0 20px rgba(0,245,255,0.5);
        line-height: 1;
        transition: transform 0.05s ease;
      }

      .score-counter.bump {
        animation: scoreBump 0.1s ease-out;
      }

      @keyframes scoreBump {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); }
        100% { transform: scale(1); }
      }

      .timer-display {
        font-size: 24px;
        font-weight: 700;
        color: #888;
      }

      .timer-display.urgent {
        color: #ff006e;
        animation: timerPulse 0.5s ease-in-out infinite;
      }

      @keyframes timerPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      .progress-bar-container {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        flex-shrink: 0;
      }

      .progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #00f5ff, #7b2fff);
        transition: width 0.1s linear;
        box-shadow: 0 0 8px rgba(0,245,255,0.5);
      }

      .tap-area {
        flex: 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
      }

      .tap-hint {
        font-size: 18px;
        color: rgba(255,255,255,0.15);
        pointer-events: none;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Ripple Effect */
      .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(0,245,255,0.3);
        border: 2px solid rgba(0,245,255,0.6);
        transform: scale(0);
        pointer-events: none;
        animation: rippleAnim 0.6s ease-out forwards;
      }

      @keyframes rippleAnim {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(4); opacity: 0; }
      }

      /* Result Screen */
      .result-screen {
        background: linear-gradient(135deg, #0a0a0a 0%, #0a1a2e 100%);
        gap: 20px;
      }

      .result-label {
        font-size: 14px;
        color: #666;
        letter-spacing: 3px;
        text-transform: uppercase;
      }

      .result-score {
        font-size: 96px;
        font-weight: 900;
        color: #00f5ff;
        text-shadow: 0 0 40px rgba(0,245,255,0.6);
        line-height: 1;
        animation: scoreReveal 0.5s ease-out forwards;
      }

      @keyframes scoreReveal {
        0% { transform: scale(0.5) translateY(20px); opacity: 0; }
        60% { transform: scale(1.1); opacity: 1; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }

      .result-score-label {
        font-size: 20px;
        color: #888;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .result-best {
        font-size: 14px;
        color: #7b2fff;
      }

      .result-new-best {
        font-size: 16px;
        font-weight: 700;
        color: #ffd700;
        animation: newBestPulse 1s ease-in-out infinite;
      }

      @keyframes newBestPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }

      .result-buttons {
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 100%;
        max-width: 280px;
      }

      .btn-primary {
        padding: 18px 32px;
        border-radius: 14px;
        border: none;
        background: linear-gradient(135deg, #00f5ff, #7b2fff);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: transform 0.1s ease, opacity 0.1s ease;
      }

      .btn-primary:active {
        transform: scale(0.97);
        opacity: 0.9;
      }

      .btn-secondary {
        padding: 16px 32px;
        border-radius: 14px;
        border: 1px solid rgba(0,245,255,0.3);
        background: transparent;
        color: #00f5ff;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: all 0.1s ease;
      }

      .btn-secondary:active {
        background: rgba(0,245,255,0.1);
      }

      .btn-ghost {
        padding: 12px 32px;
        border-radius: 14px;
        border: none;
        background: transparent;
        color: rgba(255,255,255,0.4);
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: color 0.1s ease;
      }

      .btn-ghost:active {
        color: rgba(255,255,255,0.7);
      }

      /* Leaderboard Screen */
      .leaderboard-screen {
        background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2e 100%);
        justify-content: flex-start;
        padding: 20px 0;
        overflow-y: auto;
      }

      .leaderboard-header {
        padding: 20px 24px;
        text-align: center;
        width: 100%;
        flex-shrink: 0;
      }

      .leaderboard-title {
        font-size: 28px;
        font-weight: 900;
        background: linear-gradient(90deg, #00f5ff, #7b2fff);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 4px;
      }

      .leaderboard-subtitle {
        font-size: 12px;
        color: #555;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      .leaderboard-list {
        width: 100%;
        max-width: 400px;
        padding: 0 16px;
        flex: 1;
        overflow-y: auto;
      }

      .leaderboard-item {
        display: flex;
        align-items: center;
        padding: 14px 16px;
        border-radius: 12px;
        margin-bottom: 8px;
        background: rgba(255,255,255,0.03);
        border: 1px solid rgba(255,255,255,0.06);
        gap: 12px;
        transition: background 0.2s;
      }

      .leaderboard-item.top-1 {
        background: rgba(255,215,0,0.08);
        border-color: rgba(255,215,0,0.2);
      }

      .leaderboard-item.top-2 {
        background: rgba(192,192,192,0.06);
        border-color: rgba(192,192,192,0.15);
      }

      .leaderboard-item.top-3 {
        background: rgba(205,127,50,0.06);
        border-color: rgba(205,127,50,0.15);
      }

      .leaderboard-item.my-score {
        background: rgba(0,245,255,0.05);
        border-color: rgba(0,245,255,0.2);
      }

      .rank-badge {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 900;
        flex-shrink: 0;
        background: rgba(255,255,255,0.05);
        color: #666;
      }

      .rank-badge.rank-1 { background: rgba(255,215,0,0.2); color: #ffd700; font-size: 18px; }
      .rank-badge.rank-2 { background: rgba(192,192,192,0.2); color: #c0c0c0; }
      .rank-badge.rank-3 { background: rgba(205,127,50,0.2); color: #cd7f32; }

      .rank-name {
        flex: 1;
        font-size: 16px;
        font-weight: 600;
        color: #ddd;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .rank-score {
        font-size: 20px;
        font-weight: 900;
        color: #00f5ff;
        flex-shrink: 0;
      }

      .leaderboard-footer {
        padding: 20px;
        width: 100%;
        max-width: 400px;
        flex-shrink: 0;
      }

      /* Ad Modal */
      .ad-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.9);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        flex-direction: column;
        gap: 16px;
      }

      .ad-modal {
        background: #1a1a2e;
        border: 1px solid rgba(0,245,255,0.2);
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        gap: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .ad-modal-title {
        font-size: 20px;
        font-weight: 700;
        color: #fff;
      }

      .ad-modal-desc {
        font-size: 14px;
        color: #888;
        line-height: 1.6;
      }

      .ad-countdown {
        font-size: 48px;
        font-weight: 900;
        color: #00f5ff;
        text-shadow: 0 0 20px rgba(0,245,255,0.5);
      }

      .ad-progress {
        width: 100%;
        height: 4px;
        background: rgba(255,255,255,0.1);
        border-radius: 2px;
        overflow: hidden;
      }

      .ad-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #00f5ff, #7b2fff);
        transition: width 1s linear;
      }

      .ad-skip-btn {
        background: transparent;
        border: 1px solid rgba(255,255,255,0.2);
        color: #666;
        padding: 10px 24px;
        border-radius: 20px;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.2s;
      }

      .ad-skip-btn.enabled {
        border-color: rgba(0,245,255,0.4);
        color: #00f5ff;
      }

      .ad-skip-btn.enabled:active {
        background: rgba(0,245,255,0.1);
      }

      /* Name Input Modal */
      .name-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
      }

      .name-modal {
        background: #1a1a2e;
        border: 1px solid rgba(0,245,255,0.2);
        border-radius: 20px;
        padding: 32px 28px;
        text-align: center;
        max-width: 320px;
        width: 90%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
      }

      .name-modal-title {
        font-size: 20px;
        font-weight: 700;
        color: #fff;
      }

      .name-modal-score {
        font-size: 40px;
        font-weight: 900;
        color: #00f5ff;
      }

      .name-input {
        width: 100%;
        padding: 14px 16px;
        border-radius: 12px;
        border: 1px solid rgba(0,245,255,0.3);
        background: rgba(0,0,0,0.4);
        color: #fff;
        font-size: 18px;
        text-align: center;
        outline: none;
        transition: border-color 0.2s;
      }

      .name-input:focus {
        border-color: rgba(0,245,255,0.8);
        box-shadow: 0 0 12px rgba(0,245,255,0.2);
      }

      .name-input::placeholder {
        color: #444;
      }

      .name-submit-btn {
        width: 100%;
        padding: 16px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #00f5ff, #7b2fff);
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: opacity 0.2s;
      }

      .name-submit-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      .name-cancel-btn {
        background: transparent;
        border: none;
        color: #555;
        font-size: 14px;
        cursor: pointer;
        padding: 8px;
      }

      /* Limit reached warning */
      .limit-warning {
        font-size: 13px;
        color: #ff006e;
        text-align: center;
      }

      /* Particle canvas */
      #particle-canvas {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 500;
      }

      /* Loading / empty state */
      .empty-leaderboard {
        text-align: center;
        color: #444;
        padding: 40px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <canvas id="particle-canvas"></canvas>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
